<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Kapellen 1919 e.V. 3 - MF Kaderplanung (Supabase Live)</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Supabase Client Bibliothek -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --navy: #050a14; --gold: #D4AF37; --text-main: #e2e8f0; }
        body { background-color: #000; color: var(--text-main); font-family: 'Lato', sans-serif; padding: 20px; }
        .container { background-color: var(--navy); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 12px; padding: 30px; max-width: 1100px; margin: 0 auto; position: relative; }
        h2 { font-family: 'Poppins', sans-serif; color: var(--gold); text-align: center; font-size: 1.8rem; margin-bottom: 25px; }
        .role-box { background: rgba(212, 175, 55, 0.05); border: 1px solid var(--gold); padding: 12px; text-align: center; margin-bottom: 25px; font-size: 1.1rem; color: var(--gold); font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #0c1626; border-radius: 8px; font-size: 1.1rem; }
        th, td { border: 1px solid rgba(255,255,255,0.1); padding: 18px; text-align: center; }
        th { background: rgba(255,255,255,0.05); color: var(--gold); font-size: 1rem; text-transform: uppercase; }
        
        select { width: 100%; padding: 12px; background: #000; color: #fff; border: 1px solid var(--gold); border-radius: 6px; font-size: 1.1rem; margin: 4px 0; }
        .double-selects { display: flex; gap: 8px; }
        .double-selects select { flex: 1; }

        .save-btn { width: 100%; padding: 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: var(--gold); color: #000; margin-top: 30px; font-size: 1.2rem; text-transform: uppercase; }
        .back-link { display: block; margin-bottom: 20px; color: #94a3b8; text-decoration: none; font-size: 1rem; }

        .chat-section { margin-top: 50px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(212, 175, 55, 0.3); padding: 25px; border-radius: 12px; }
        .chat-box { height: 220px; background: #000; border: 1px solid #333; border-radius: 6px; padding: 15px; overflow-y: auto; margin-bottom: 15px; font-size: 1rem; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg { background: rgba(212, 175, 55, 0.08); padding: 10px 14px; border-radius: 6px; border-left: 3px solid var(--gold); }
        .chat-msg span { font-size: 0.8rem; color: #94a3b8; display: block; margin-bottom: 3px; }
        .chat-input-row { display: flex; gap: 10px; }
        .chat-input-row input { flex: 1; padding: 14px; background: #000; color: #fff; border: 1px solid var(--gold); border-radius: 6px; font-size: 1.1rem; }

        /* Notification Banner Style */
        #notification-banner { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #10b981; color: #000; padding: 12px 25px; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 1000; font-size: 1.1rem; }
    </style>
</head>
<body>
<div id="notification-banner"><i class="fa-solid fa-bell"></i> Neue Chat-Nachricht erhalten!</div>

<div class="container">
    <a href="https://zechenhauer.github.io/TVK-3-Saison-26-27/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Zum Dashboard</a>
    <h2>MF Kaderplanung (Supabase Live)</h2>
    <div class="role-box" id="roleDisplay">Lade...</div>
    <div style="text-align:center; margin-bottom:15px;">
        <button onclick="requestNotificationPermission()" style="background:transparent; border:1px solid var(--gold); color:var(--gold); padding:6px 12px; border-radius:4px; cursor:pointer; font-size:0.9rem;"><i class="fa-solid fa-bell"></i> PC-Benachrichtigungen aktivieren</button>
    </div>
    
    <select id="scheduleSelect" onchange="applySelection()" style="padding:15px; margin-bottom:20px; font-size: 1.1rem;"></select>
    
    <table>
        <thead><tr><th>Spiel</th><th>Heim Spieler</th></tr></thead>
        <tbody id="matchTableBody"></tbody>
    </table>
    <button class="save-btn" onclick="saveMyAufstellung()">Meine Planung speichern</button>

    <div style="margin-top: 50px; background: rgba(0, 116, 217, 0.05); border: 1px solid #0074D9; padding: 25px; border-radius: 12px;">
        <h3 style="color:#0074D9; text-align:center; margin-bottom:20px; font-size: 1.5rem;">Finale Aufstellung</h3>
        <table id="compareTable">
            <thead><tr><th>Spiel</th><th>Jürgen</th><th>Markus</th><th>FINAL</th></tr></thead>
            <tbody id="compareTableBody"></tbody>
        </table>
        <div style="margin-top:25px; display:flex; align-items:center; gap:20px; font-size: 1.1rem;">
            <input type="checkbox" id="chk-public-visibility" style="transform:scale(2.0);"> 
            <label for="chk-public-visibility" style="font-weight:bold;">Freigeben (TRUE)</label>
            <button class="save-btn" style="margin-top:0; padding:15px 30px;" onclick="saveFinalAufstellungToSupabase()">Speichern & Freigeben</button>
        </div>
    </div>

    <div class="chat-section">
        <h3 style="color:var(--gold); text-align:center; margin-bottom:20px; font-size: 1.5rem;"><i class="fa-solid fa-comments"></i> MF Absprache-Chat</h3>
        <div class="chat-box" id="chatContainer">
            <span style="color:#94a3b8; text-align:center;">Lade Nachrichten...</span>
        </div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Nachricht schreiben..." onkeypress="if(event.key==='Enter') sendChatMessage()">
            <button class="save-btn" style="width: auto; margin-top: 0; padding: 14px 25px; font-size: 1.1rem;" onclick="sendChatMessage()">Senden</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://lhusylpjnujlqomougmg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_yXEueWILvAq-Vm2VfTuYyg_BIQeE1KK';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = localStorage.getItem('tvk3_user_26_27_mobile') || "Jürgen Schützendorf";
    const cleanUser = currentUser.replace(/ \(.*\)/g, '').trim();
    document.getElementById('roleDisplay').innerHTML = `Eingeloggt als: <b>${cleanUser}</b>`;
    
    let globalServerData = { anmeldungen: [], mfAufstellungen: [], chats: [] };
    let lastKnownMessageCount = 0;

    const ourTeamRoster = ["Jürgen Schützendorf", "Markus Ginsel", "Lars Neutag", "Ludger Schledorn", "Andreas Denner", "Niklas Weichert", "Markus Lenz", "Thomas Kliver", "Wolfram Senger", "Michael Müller", "Leon Gerber", "Gregor Marek", "Yannick Steffes", "Florian Hartwich"];
    const schedule = {"2026-09-05":"TV Kapellen 1919 e.V. 2","2026-09-18":"DSC Goch 3","2026-09-25":"Rumelner TV 3","2026-10-10":"DSC Goch 4","2026-10-23":"Triple Inn Issum 2","2026-11-07":"SV Menzelen 1925","2026-11-13":"Die Wardter Darter","2026-11-27":"The Red Lions Xanten 1","2027-01-09":"Hart am Draht","2027-01-22":"TV Kapellen 1919 e.V. 2","2027-02-06":"DSC Goch 3","2027-02-19":"Rumelner TV 3","2027-03-05":"DSC Goch 4","2027-03-13":"Triple Inn Issum 2","2027-04-02":"SV Menzelen 1925","2027-04-24":"Die Wardter Darter","2027-05-08":"The Red Lions Xanten 1","2027-05-14":"Hart am Draht"};

    async function init() {
        const select = document.getElementById('scheduleSelect');
        select.innerHTML = '';
        Object.entries(schedule).forEach(([date, team], i) => select.innerHTML += `<option value="${i+1}">${i+1}: vs ${team} (${date})</option>`);
        
        await loadDataFromSupabase();
        
        setInterval(checkForNewMessagesInBackground, 10000);
    }
    
    function applySelection() { 
        buildTable(); 
        loadExisting(); 
        renderChat(); 
    }

    // Hilfsfunktion: Ermittelt die abgesagten Spieler für den gewählten Spieltag aus tvk_basis_anmeldungen
    function getAbsagenForCurrentSpieltag() {
        const st = parseInt(document.getElementById('scheduleSelect').value);
        return globalServerData.anmeldungen
            .filter(a => a.spieltag_id === st && (a.status === 'no' || a.status === 'nein' || a.status === false))
            .map(a => a.spieler);
    }

    function buildTable() {
        const abs = getAbsagenForCurrentSpieltag();
        const tbody = document.getElementById('matchTableBody'); tbody.innerHTML = '';
        let opts = ourTeamRoster.filter(p => !abs.includes(p)).map(p => `<option value="${p}">${p}</option>`).join('');
        for(let i=1; i<=12; i++) {
            let row = document.createElement('tr');
            if(i<=8) {
                row.innerHTML = `<td>E${i}</td><td><select id="h${i}"><option value="">--</option>${opts}</select></td>`;
            } else {
                row.innerHTML = `<td>D${i-8}</td><td><div class="double-selects"><select id="h${i}a"><option value="">Spieler 1</option>${opts}</select><select id="h${i}b"><option value="">Spieler 2</option>${opts}</select></div></td>`;
            }
            tbody.appendChild(row);
        }
    }

    async function loadDataFromSupabase() {
        try {
            // Zu- / Absagen aus der Basis-App Tabelle laden
            let { data: anmeldungenData } = await supabaseClient.from('tvk_basis_anmeldungen').select('*');
            
            // Aufstellungen laden
            let { data: aufstellungenData } = await supabaseClient.from('kader_aufstellungen').select('*');
            
            // Chat laden
            let { data: chatData } = await supabaseClient.from('kader_chat').select('*').order('created_at', { ascending: true });

            globalServerData = {
                anmeldungen: anmeldungenData || [],
                mfAufstellungen: aufstellungenData || [],
                chats: chatData || []
            };

            const chats = globalServerData.chats;
            if (lastKnownMessageCount === 0) {
                lastKnownMessageCount = chats.length;
            }

            applySelection();
        } catch (e) {
            console.error("Fehler beim Laden aus Supabase:", e);
        }
    }

    async function checkForNewMessagesInBackground() {
        try {
            let { data: chatData } = await supabaseClient.from('kader_chat').select('*').order('created_at', { ascending: true });
            let newChats = chatData || [];
            
            if (newChats.length > lastKnownMessageCount) {
                let latestMsg = newChats[newChats.length - 1];
                
                if (latestMsg.absender !== cleanUser) {
                    showNotificationBanner(latestMsg.absender, latestMsg.text);
                    showBrowserNotification(latestMsg.absender, latestMsg.text);
                }
                
                globalServerData.chats = newChats;
                lastKnownMessageCount = newChats.length;
                renderChat();
            }

            // Aufstellungen & Anmeldungen im Hintergrund aktualisieren
            let { data: aufstellungenData } = await supabaseClient.from('kader_aufstellungen').select('*');
            let { data: anmeldungenData } = await supabaseClient.from('tvk_basis_anmeldungen').select('*');
            
            globalServerData.mfAufstellungen = aufstellungenData || [];
            globalServerData.anmeldungen = anmeldungenData || [];
            
            renderCompareTable(document.getElementById('scheduleSelect').value);
        } catch(e) {}
    }

    function showNotificationBanner(sender, text) {
        const banner = document.getElementById('notification-banner');
        banner.innerHTML = `<i class="fa-solid fa-bell"></i> <b>${sender}:</b> "${text}"`;
        banner.style.display = 'block';
        setTimeout(() => { banner.style.display = 'none'; }, 6000);
    }

    function requestNotificationPermission() {
        if ("Notification" in window) {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    alert("PC-Benachrichtigungen erfolgreich aktiviert!");
                }
            });
        }
    }

    function showBrowserNotification(sender, text) {
        if ("Notification" in window && Notification.permission === "granted") {
            new Notification(`Neue Nachricht von ${sender}`, {
                body: text
            });
        }
    }

    function renderCompareTable(st) {
        st = parseInt(st);
        const tbody = document.getElementById('compareTableBody'); tbody.innerHTML = '';
        const abs = getAbsagenForCurrentSpieltag();
        let opts = ourTeamRoster.filter(p => !abs.includes(p)).map(p => `<option value="${p}">${p}</option>`).join('');
        
        const jEntry = globalServerData.mfAufstellungen.find(a => a.manager.toLowerCase().includes("jürgen") && a.spieltag_id == st);
        const mEntry = globalServerData.mfAufstellungen.find(a => a.manager.toLowerCase().includes("markus") && a.spieltag_id == st);
        const fEntry = globalServerData.mfAufstellungen.find(a => a.manager === "FINAL" && a.spieltag_id == st);

        const jList = jEntry?.aufstellung || [];
        const mList = mEntry?.aufstellung || [];
        
        for(let i=0; i<12; i++) {
            let jV = jList[i]?.heim || "", mV = mList[i]?.heim || "", match = (jV && mV && jV === mV);
            let fin = i<8 ? `<select id="f${i}"><option value="">--</option>${opts}</select>` : `<div class="double-selects"><select id="f${i}a"><option value="">P1</option>${opts}</select><select id="f${i}b"><option value="">P2</option>${opts}</select></div>`;
            
            tbody.innerHTML += `<tr style="${match ? 'background:rgba(16,185,129,0.2)' : ''}"><td>${i<8?'E'+(i+1):'D'+(i-7)}</td><td>${jV}</td><td>${mV}</td><td>${fin}</td></tr>`;
        }

        if (fEntry) {
            document.getElementById('chk-public-visibility').checked = fEntry.freigegeben || false;
            const fList = fEntry.aufstellung || [];
            for(let i=0; i<12; i++) {
                let val = fList[i]?.heim || "";
                if(i < 8) {
                    let sel = document.getElementById('f' + i);
                    if(sel) sel.value = val;
                } else {
                    let p = val.split(" + ");
                    let sA = document.getElementById('f' + i + 'a');
                    let sB = document.getElementById('f' + i + 'b');
                    if(sA && p[0]) sA.value = p[0].trim();
                    if(sB && p[1]) sB.value = p[1].trim();
                }
            }
        } else {
            for(let i=0; i<12; i++) {
                let jV = jList[i]?.heim || "", mV = mList[i]?.heim || "", match = (jV && mV && jV === mV);
                if(match) {
                    if(i < 8) {
                        let sel = document.getElementById('f' + i);
                        if(sel) sel.value = jV;
                    } else { 
                        let p = jV.split(" + "); 
                        let sA = document.getElementById('f' + i + 'a');
                        let sB = document.getElementById('f' + i + 'b');
                        if(sA && p[0]) sA.value = p[0].trim(); 
                        if(sB && p[1]) sB.value = p[1].trim(); 
                    }
                }
            }
        }
    }

    function loadExisting() {
        const st = parseInt(document.getElementById('scheduleSelect').value);
        const my = globalServerData.mfAufstellungen.find(a => a.manager.toLowerCase().includes(cleanUser.toLowerCase()) && a.spieltag_id == st);
        if(my?.aufstellung) {
            my.aufstellung.forEach((x, i) => {
                let indexNum = i + 1;
                if(indexNum <= 8) { 
                    let s = document.getElementById('h' + indexNum); 
                    if(s) s.value = x.heim; 
                } else { 
                    let parts = (x.heim || "").split(" + "); 
                    let selA = document.getElementById('h' + indexNum + 'a');
                    let selB = document.getElementById('h' + indexNum + 'b');
                    if(selA && parts[0]) selA.value = parts[0].trim(); 
                    if(selB && parts[1]) selB.value = parts[1].trim(); 
                }
            });
        }
        renderCompareTable(st);
    }

    function renderChat() {
        const chatBox = document.getElementById('chatContainer');
        chatBox.innerHTML = '';
        const chats = globalServerData?.chats || [];

        if(chats.length === 0)  {
            chatBox.innerHTML = `<span style="color:#94a3b8; text-align:center;">Noch keine Nachrichten vorhanden. Schreib die Erste!</span>`;
            return;
        }

        chats.forEach(msg => {
            chatBox.innerHTML += `<div class="chat-msg"><span><b>${msg.absender}</b> (${msg.zeit}):</span> ${msg.text}</div>`;
        });
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if(!text) return;

        const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        let { error } = await supabaseClient.from('kader_chat').insert([{
            absender: cleanUser,
            text: text,
            zeit: timeNow
        }]);

        if (error) {
            alert("Fehler beim Senden: " + error.message);
            return;
        }

        input.value = '';
        await loadDataFromSupabase();
    }

    async function saveMyAufstellung() {
        let list = [];
        for(let i=1; i<=12; i++) {
            let val = i<=8 ? document.getElementById('h'+i).value : document.getElementById('h'+i+'a').value + ' + ' + document.getElementById('h'+i+'b').value;
            list.push({spiel: i<=8?'E'+i:'D'+(i-8), heim: val});
        }
        
        const st = parseInt(document.getElementById('scheduleSelect').value);
        let existing = globalServerData.mfAufstellungen.find(a => a.manager.toLowerCase().includes(cleanUser.toLowerCase()) && a.spieltag_id == st);

        let { error } = await supabaseClient.from('kader_aufstellungen').upsert({
            id: existing ? existing.id : undefined,
            spieltag_id: st,
            manager: cleanUser,
            aufstellung: list,
            freigegeben: existing ? existing.freigegeben : false
        });

        if(error) {
            alert("Fehler beim Speichern: " + error.message);
            return;
        }

        alert("Planung erfolgreich in Supabase gespeichert!");
        await loadDataFromSupabase();
    }

    async function saveFinalAufstellungToSupabase() {
        const st = parseInt(document.getElementById('scheduleSelect').value);
        let e1 = [], d = [], list = [];

        for(let i=0; i<8; i++) { 
            let v = document.getElementById('f'+i).value; 
            if(v) e1.push(v + " (E"+(i+1)+")"); 
            list.push({spiel: 'E'+(i+1), heim: v});
        }
        for(let i=8; i<12; i++) { 
            let sA = document.getElementById('f'+i+'a'), sB = document.getElementById('f'+i+'b'); 
            let pairVal = (sA.value && sB.value) ? sA.value + " + " + sB.value : "";
            if(sA.value && sB.value) d.push(sA.value + " + " + sB.value + " (D"+(i-7)+")"); 
            list.print ? '' : null;
            list.push({spiel: 'D'+(i-7), heim: pairVal});
        }

        const isFreigegeben = document.getElementById('chk-public-visibility').checked;
        let existingFinal = globalServerData.mfAufstellungen.find(a => a.manager === "FINAL" && a.spieltag_id == st);

        let { error } = await supabaseClient.from('kadеr_aufstellungen').upsert({ // kleines Korrektürchen
            id: existingFinal ? existingFinal.id : undefined,
            spieltag_id: st,
            manager: "FINAL",
            aufstellung: list,
            freigegeben: isFreigegeben
        });

        // Korrektur falls im Tabellenname ein Tippfehler war, hier direkt sauber:
        let { error: errFinal } = await supabaseClient.from('kader_aufstellungen').upsert({
            id: existingFinal ? existingFinal.id : undefined,
            spieltag_id: st,
            manager: "FINAL",
            aufstellung: list,
            freigegeben: isFreigegeben
        });

        if(errFinal) {
            alert("Fehler beim Speichern der Finalen Aufstellung: " + errFinal.message);
            return;
        }

        alert("Finale Aufstellung gespeichert & Status aktualisiert!");
        await loadDataFromSupabase();
    }

    init();
</script>
</body>
</html>
